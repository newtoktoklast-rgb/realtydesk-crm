[package]
name = "realtydesk"
version = "0.1.2"
description = "RealtyDesk CRM desktop client"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[[bin]]
name = "realtydesk"
path = "src/main.rs"
